version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oidc-postgres
    environment:
      POSTGRES_USER: oidc_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oidc_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oidc_user -d oidc_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oidc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
  # Uncomment to run the auth server in Docker
  auth-server:
    build: .
    container_name: oidc-auth-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://oidc_user:password@postgres:5432/oidc_db
      REDIS_URL: redis://redis:6379
      RUST_LOG: info,auth_server=debug
      SERVER_HOST: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./keys:/app/keys

volumes:
  postgres_data:
  redis_data:

[workspace]
resolver = "2"
members = [
    "crates/auth-server",
    "crates/authentication",
    "crates/security",
    "crates/audit",
    "crates/federation",
    "crates/clients",
    "crates/users",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OIDC SSO Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/rust-oidc-sso"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["limit", "timeout", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography and security
jsonwebtoken = "9.2"
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.21"
ring = "0.17"
rand = "0.8.5"

# UUID and time
uuid = { version = "1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Configuration
config = "0.13"
dotenvy = "0.15"

# TOTP for MFA
totp-rs = { version = "5.4", features = ["qr", "gen_secret"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = [
    "crates/auth-server",
    "crates/authentication",
    "crates/security",
    "crates/audit",
    "crates/federation",
    "crates/clients",
    "crates/users",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OIDC SSO Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/rust-oidc-sso"

[workspace.dependencies]
# Standard dependencies
tokio = { version = "=1.35.0", features = ["full"] }
tokio-util = "=0.7.10"
axum = { version = "=0.7.4", features = ["macros"] }
tower = { version = "=0.4.13", features = ["limit", "timeout", "load-shed"] }
tower-http = { version = "=0.5.1", features = ["cors", "trace", "compression-gzip"] }
sqlx = { version = "=0.7.3", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "=0.24.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.120"
jsonwebtoken = "=9.3.0"
argon2 = "=0.5.3"
sha2 = "=0.10.8"
base64 = "=0.21.7"
ring = "=0.17.8"
rand = "=0.8.5"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.34", features = ["serde"] }
validator = { version = "=0.16.1", features = ["derive"] }
reqwest = { version = "=0.11.24", features = ["json", "rustls-tls"], default-features = false }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "json"] }
thiserror = "=1.0.56"
anyhow = "=1.0.79"
config = "=0.13.4"
dotenvy = "=0.15.7"
totp-rs = { version = "=5.4.0", features = ["qr", "gen_secret"] }

# Explicit pins for transitive dependencies to block malicious versions
getrandom = "=0.2.16"
ahash = "=0.8.11"
tempfile = "=3.12.0"
image = "=0.25.2"
qrcodegen-image = "=1.4.0"
arc-swap = "=1.7.1"
rustversion = "=1.0.19"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.72"
web-sys = "=0.3.72"
wasm-bindgen-futures = "=0.4.40"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
